steps:
  - id: terraform-fmt
    name: hashicorp/terraform:1.15.8
    args: ['fmt', '-check', '-recursive']

  - id: terraform-init
    name: hashicorp/terraform:1.15.8
    args: ['init', '-backend-config=environments/dev.tfbackend']

  - id: terraform-validate
    name: hashicorp/terraform:1.15.8
    args: ['validate']

  - id: terraform-plan
    name: hashicorp/terraform:1.15.8
    args: ['plan', '-var-file=environments/dev.tfvars', '-out=tfplan']

  - id: terraform-plan-json
    name: hashicorp/terraform:1.15.8
    entrypoint: sh
    args: ['-c', 'terraform show -json tfplan > plan.json']

  - id: policy-checks
    name: python:3.12-slim
    entrypoint: sh
    args: ['-c', 'python3 scripts/policy_checks.py plan.json | tee findings.json']

  - id: plan-summary
    name: python:3.12-slim
    entrypoint: sh
    args: ['-c', 'python3 scripts/summarize_plan.py plan.json | tee summary.md']

  - id: review-generation
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args: ['-c', 'python3 scripts/review_generator.py plan.json findings.json | tee review.md']
    env:
      - 'MODEL_API_URL=$_MODEL_API_URL'
      - 'MODEL_NAME=$_MODEL_NAME'

  - id: pr-comment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: ['scripts/post_pr_comment.py']
    env:
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'REPO_FULL_NAME=$_REPO_FULL_NAME'

serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/sa-cb-plan-dev@$PROJECT_ID.iam.gserviceaccount.com'

substitutions:
  # Set by cloudbuild_client.py when a PR triggers the build; empty for
  # manual `gcloud builds submit` runs, which post_pr_comment.py treats as
  # "skip commenting" rather than an error.
  _PR_NUMBER: ''
  _REPO_FULL_NAME: 'sinex-cloud/infrastructure-terraform-gcp'
  # Gemini's OpenAI-compatible endpoint (https://ai.google.dev/gemini-api/docs/openai).
  # The API key itself is never here -- it's in Secret Manager, fetched by
  # review_generator.py at build time.
  _MODEL_API_URL: 'https://generativelanguage.googleapis.com/v1beta/openai'
  _MODEL_NAME: 'gemini-flash-lite-latest'

options:
  logging: CLOUD_LOGGING_ONLY
