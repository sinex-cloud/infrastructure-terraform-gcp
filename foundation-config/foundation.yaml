version: 1.0

# Static metadata applied as labels to every labellable resource.
# `environment`, `managed_by` and `component` are derived by the module.
labels:
  platform: data-platform
  owner: data-engineering
  application: infra-review
  data_classification: internal

additional_project_permissions:
  # --- Baseline read access (replaces the basic roles/viewer grant) ---
  - role: browser
    environments: [dev, int]
    members:
      users:
        - ahmed.brini.ar@gmail.com
        - anwar.brini.ar@gmail.com

  - role: logging.viewer
    environments: [dev, int]
    members:
      users:
        - ahmed.brini.ar@gmail.com
        - anwar.brini.ar@gmail.com

  - role: monitoring.viewer
    environments: [dev, int]
    members:
      users:
        - ahmed.brini.ar@gmail.com
        - anwar.brini.ar@gmail.com

  - role: bigquery.metadataViewer
    environments: [dev, int]
    members:
      users:
        - ahmed.brini.ar@gmail.com
        - anwar.brini.ar@gmail.com

  # --- dev: build and deploy the review agent ---
  - role: bigquery.jobUser
    environments: [dev]
    members:
      users:
        - ahmed.brini.ar@gmail.com

  - role: run.admin
    environments: [dev]
    members:
      users:
        - ahmed.brini.ar@gmail.com

  - role: cloudbuild.builds.editor
    environments: [dev]
    members:
      users:
        - ahmed.brini.ar@gmail.com

  - role: storage.admin
    environments: [dev]
    members:
      users:
        - ahmed.brini.ar@gmail.com

  - role: secretmanager.secretAccessor
    environments: [dev]
    members:
      users:
        - ahmed.brini.ar@gmail.com

  # --- int: read-only inspection of the deployed agent ---
  - role: run.viewer
    environments: [int]
    members:
      users:
        - ahmed.brini.ar@gmail.com

  - role: run.invoker
    environments: [int]
    members:
      users:
        - ahmed.brini.ar@gmail.com

  - role: cloudbuild.builds.viewer
    environments: [int]
    members:
      users:
        - ahmed.brini.ar@gmail.com

managed_datasets:
  platform_analytics:
    location: europe-west1
    environments: [dev, int]
    permissions:
      - role: bigquery.dataViewer
        members:
          users:
            - ahmed.brini.ar@gmail.com
            - anwar.brini.ar@gmail.com

buckets:
  raw-data:
    location: europe-west1
    environments: [dev, int]
    permissions:
      - role: storage.objectViewer
        members:
          users:
            - ahmed.brini.ar@gmail.com
            - anwar.brini.ar@gmail.com
